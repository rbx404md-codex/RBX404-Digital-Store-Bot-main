services:
  rbx404-bot:
    build: .
    container_name: rbx404-digital-store-bot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${WEB_PORT:-8099}:8099"
    volumes:
      - rbx404-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,os; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('WEB_PORT','8099') + '/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  rbx404-data:
    driver: local
